services:
  arena-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: spanguard-arena:latest
    container_name: spanguard-arena-api
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      # Named writable volume ONLY for the audit log path
      - audit_logs:/var/log/spanguard:rw
    environment:
      - PYTHONUNBUFFERED=1
      - SPANGUARD_AUDIT_LOG_PATH=/var/log/spanguard/audit.jsonl
    # Only exposed internally to reverse proxy gateway — NOT published directly to host
    expose:
      - "8443"
    networks:
      - internal_net

  gateway:
    image: nginx:alpine
    container_name: spanguard-gateway
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=64m
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    # Configurable high port exposed on host (defaults to 18443)
    ports:
      - "${GATEWAY_PORT:-18443}:8443"
    depends_on:
      - arena-api
    networks:
      - internal_net

volumes:
  audit_logs:
    name: spanguard_audit_logs

networks:
  internal_net:
    name: spanguard_internal_net
    internal: false

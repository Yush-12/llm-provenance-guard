# =============================================================================
# bench/corpus/benign.yaml
#
# Benign Benchmark Corpus with two distinct classes:
#   1. benign_adversarial_user: Attack-shaped language in Trust.USER spans.
#      Evaluates to 0% false positives, proving DATA-scoping.
#   2. benign_adversarial_data: Realistic customer support / technical tickets
#      in Trust.DATA spans. Yields a low, plausible, non-zero false positive rate.
# =============================================================================


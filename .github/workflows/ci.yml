name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Format check
        run: uv run ruff format --check src tests bench proxy arena

      - name: Lint
        run: uv run ruff check src tests bench proxy arena

      - name: Type check (strict)
        run: uv run mypy src bench proxy arena

      - name: Run test suite
        run: uv run pytest

      - name: Run security benchmark suite
        run: uv run python -m bench.runner
